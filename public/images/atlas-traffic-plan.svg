<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
  <rect width="960" height="720" fill="#141619"/>
  <!-- Technical CROW 96b Traffic Plan Blueprint Grid -->
  <g stroke="#2A2D31" stroke-width="1">
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="480" x2="960" y2="480"/>
    <line x1="0" y1="600" x2="960" y2="600"/>
    <line x1="160" y1="0" x2="160" y2="720"/>
    <line x1="320" y1="0" x2="320" y2="720"/>
    <line x1="480" y1="0" x2="480" y2="720"/>
    <line x1="640" y1="0" x2="640" y2="720"/>
    <line x1="800" y1="0" x2="800" y2="720"/>
  </g>

  <!-- Intersection Schematic Plan -->
  <rect x="0" y="270" width="960" height="180" fill="#1E2228" stroke="#5B6168" stroke-width="2"/>
  <rect x="390" y="0" width="180" height="720" fill="#1E2228" stroke="#5B6168" stroke-width="2"/>
  <line x1="0" y1="360" x2="960" y2="360" stroke="#E2DFD8" stroke-width="3" stroke-dasharray="20 14"/>
  <line x1="480" y1="0" x2="480" y2="720" stroke="#E2DFD8" stroke-width="3" stroke-dasharray="20 14"/>

  <!-- Work Zone (Werkvak) Hatching in Signal Orange -->
  <rect x="520" y="285" width="260" height="70" fill="#FF6A00" fill-opacity="0.18" stroke="#FF6A00" stroke-width="3"/>
  <!-- Beacon Nodes on Blueprint -->
  <g fill="#FF6A00">
    <circle cx="495" cy="340" r="6"/>
    <circle cx="510" cy="315" r="6"/>
    <circle cx="545" cy="285" r="6"/>
    <circle cx="610" cy="285" r="6"/>
    <circle cx="675" cy="285" r="6"/>
    <circle cx="740" cy="285" r="6"/>
  </g>

  <!-- Diversion Flow Arrow -->
  <path d="M220 320 L435 320 L435 160" stroke="#FF6A00" stroke-width="5" stroke-dasharray="12 8" fill="none"/>
  <polygon points="435,145 423,168 447,168" fill="#FF6A00"/>

  <!-- RVV Sign Callout Circles -->
  <circle cx="240" cy="230" r="24" fill="#F6F5F1" stroke="#FF6A00" stroke-width="6"/>
  <circle cx="790" cy="490" r="24" fill="#0055A4" stroke="#F6F5F1" stroke-width="4"/>
</svg>
