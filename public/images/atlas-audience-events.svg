    <line x1="120" y1="420" x2="40" y2="680"/>
    <line x1="280" y1="415" x2="210" y2="680"/>
    <line x1="440" y1="410" x2="380" y2="680"/>
    <line x1="600" y1="405" x2="550" y2="680"/>
