<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
  <rect width="960" height="720" fill="#141619"/>
  <!-- Construction Site Gate & Crane Silhouette -->
  <g stroke="#2A2D31" stroke-width="3">
    <line x1="720" y1="30" x2="720" y2="380"/>
    <line x1="420" y1="75" x2="910" y2="75"/>
    <line x1="720" y1="30" x2="540" y2="75"/>
    <line x1="720" y1="30" x2="860" y2="75"/>
  </g>

  <!-- Site Perimeter Fencing & Access Cabin -->
  <rect x="60" y="190" width="290" height="230" fill="#1E2228" stroke="#39414C" stroke-width="2"/>
  <rect x="85" y="225" width="140" height="95" fill="#2C3540"/>
  <rect x="255" y="225" width="65" height="195" fill="#17191C" stroke="#5B6168" stroke-width="2"/>

  <!-- Asphalt Access Lane -->
  <polygon points="0,420 960,400 960,720 0,720" fill="#0F1012"/>

  <!-- Automated Barrier Boom Arm (Slagboom) -->
  <rect x="370" y="340" width="38" height="95" fill="#FF6A00"/>
  <rect x="395" y="352" width="460" height="18" fill="#F6F5F1"/>
  <g fill="#FF6A00">
    <polygon points="430,352 465,352 450,370 415,370"/>
    <polygon points="520,352 555,352 540,370 505,370"/>
    <polygon points="610,352 645,352 630,370 595,370"/>
    <polygon points="700,352 735,352 720,370 685,370"/>
    <polygon points="790,352 825,352 810,370 775,370"/>
  </g>

  <!-- Bouwportier / Gate Controller with Clipboard & Plain Hi-Vis -->
  <g transform="translate(460, 215)">
    <rect x="44" y="240" width="36" height="165" fill="#17191C"/>
    <rect x="88" y="240" width="36" height="165" fill="#1B1F24"/>
    <rect x="44" y="345" width="36" height="14" fill="#E8ECEF"/>
    <rect x="88" y="345" width="36" height="14" fill="#E8ECEF"/>
    <path d="M25 95 L145 95 L155 250 L15 250 Z" fill="#FF6A00"/>
    <path d="M35 115 L135 115 L145 250 L25 250 Z" fill="#E6F52C"/>
    <rect x="42" y="95" width="16" height="155" fill="#E8ECEF"/>
    <rect x="112" y="95" width="16" height="155" fill="#E8ECEF"/>
    <rect x="22" y="185" width="126" height="16" fill="#E8ECEF"/>
    <!-- Registration Tablet / Clipboard -->
    <rect x="125" y="145" width="46" height="60" rx="3" fill="#0F1012" stroke="#9CA1A7" stroke-width="2"/>
    <circle cx="85" cy="62" r="22" fill="#D29975"/>
    <path d="M56 56 C56 24 114 24 114 56 Z" fill="#F6F5F1"/>
  </g>
</svg>
