<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
  <rect width="960" height="720" fill="#17191C"/>
  <!-- Architectural Urban Street Grid & Dutch Cycle Path (Fietspad) -->
  <polygon points="0,280 960,240 960,720 0,720" fill="#1E2126"/>
  <!-- Red Dutch Cycle Lane -->
  <polygon points="0,420 960,340 960,510 0,620" fill="#7C2D26"/>
  <line x1="0" y1="420" x2="960" y2="340" stroke="#E2DFD8" stroke-width="4" stroke-dasharray="20 14"/>
  <line x1="0" y1="620" x2="960" y2="510" stroke="#E2DFD8" stroke-width="5"/>

  <!-- Pedestrian Zebra Crossing Stripes -->
  <g fill="#F6F5F1" opacity="0.88">
    <polygon points="180,450 260,442 310,540 220,552"/>
    <polygon points="310,436 390,428 445,524 355,534"/>
    <polygon points="440,422 520,414 580,508 490,518"/>
  </g>

  <!-- Urban Building Silhouettes -->
  <rect x="60" y="60" width="180" height="210" fill="#23272E" stroke="#2A2D31" stroke-width="2"/>
  <rect x="260" y="90" width="220" height="175" fill="#1F2329" stroke="#2A2D31" stroke-width="2"/>
  <rect x="510" y="45" width="260" height="215" fill="#23272E" stroke="#2A2D31" stroke-width="2"/>

  <!-- Temporary Barrier (Schrikhek) -->
  <g transform="translate(560, 290)">
    <rect x="0" y="0" width="240" height="36" fill="#F6F5F1"/>
    <polygon points="20,0 55,0 35,36 0,36" fill="#FF6A00"/>
    <polygon points="90,0 125,0 105,36 70,36" fill="#FF6A00"/>
    <polygon points="160,0 195,0 175,36 140,36" fill="#FF6A00"/>
    <rect x="25" y="36" width="10" height="85" fill="#5B6168"/>
    <rect x="205" y="36" width="10" height="85" fill="#5B6168"/>
  </g>

  <!-- Traffic Controller Guiding Urban Flow (Plain Unmarked Hi-Vis) -->
  <g transform="translate(620, 210)">
    <rect x="48" y="255" width="38" height="175" fill="#121417"/>
    <rect x="96" y="255" width="38" height="175" fill="#16191E"/>
    <rect x="48" y="365" width="38" height="14" fill="#E8ECEF"/>
    <rect x="96" y="365" width="38" height="14" fill="#E8ECEF"/>
    <path d="M28 100 L154 100 L166 265 L18 265 Z" fill="#E6F52C"/>
    <rect x="44" y="100" width="18" height="165" fill="#E8ECEF"/>
    <rect x="120" y="100" width="18" height="165" fill="#E8ECEF"/>
    <rect x="22" y="185" width="138" height="18" fill="#E8ECEF"/>
    <rect x="20" y="222" width="142" height="18" fill="#E8ECEF"/>
    <!-- Outstretched Guiding Arm -->
    <path d="M30 112 L-55 135 L-45 168 L35 152 Z" fill="#FF6A00"/>
    <circle cx="91" cy="68" r="24" fill="#D29975"/>
    <path d="M60 62 C60 26 122 26 122 62 Z" fill="#F6F5F1"/>
  </g>
</svg>
